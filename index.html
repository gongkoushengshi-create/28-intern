// ─── STATE (localStorage) ───────────────────────────────────────────────────
const STORE_KEY = idx => `shukatsu_28_row_${idx}`;
function defaultState() { return { progress: 0, memo: '', fav: false }; }
function loadState(idx) {
  try { return Object.assign(defaultState(), JSON.parse(localStorage.getItem(STORE_KEY(idx)))); }
  catch { return defaultState(); }
}
function saveState(idx, s) { localStorage.setItem(STORE_KEY(idx), JSON.stringify(s)); }

// ─── PROGRESS ────────────────────────────────────────────────────────────────
const PROGRESS = ['未応募','エントリー済','ES提出済','面接中','結果待ち','合格 ✓','不合格 ✗'];
const PROG_CLASS = ['prog-0','prog-1','prog-2','prog-3','prog-4','prog-5','prog-6'];

// ─── COUNTDOWN ───────────────────────────────────────────────────────────────
const TODAY = new Date(2026, 4, 29); // 2026-05-29

function daysUntil(deadline) {
  const m = deadline.match(/^(\d+)\/(\d+)/);
  if (!m) return null;
  const target = new Date(2026, +m[1] - 1, +m[2]);
  return Math.ceil((target - TODAY) / 86400000);
}

function countdownHtml(deadline) {
  const d = daysUntil(deadline);
  if (d === null) return '';
  if (d < 0)  return `<span class="countdown cd-done">締切済</span>`;
  if (d === 0) return `<span class="countdown cd-urgent">本日</span>`;
  if (d <= 3)  return `<span class="countdown cd-urgent">あと${d}日</span>`;
  if (d <= 7)  return `<span class="countdown cd-soon">あと${d}日</span>`;
  return `<span class="countdown cd-normal">あと${d}日</span>`;
}

function deadlineToNum(d) {
  const m = d.match(/^(\d+)\/(\d+)/);
  if (!m) return 9999;
  return +m[1] * 100 + +m[2];
}

// ─── FILTER STATE ────────────────────────────────────────────────────────────
const INDUSTRIES = [...new Set(DATA.map(r => r[0]))];
const LABEL_MAP = {
  "IT・メガベンチャー": "IT",
  "コンサル・シンクタンク": "コンサル",
  "メーカー・電機・精密": "メーカー",
  "インフラ・エネルギー": "インフラ",
  "消費財・広告・メディア": "消費財・広告",
};
let activeIndustry = '全て';
let hideFinished = false;
let favOnly = false;
let searchText = '';
let sortAsc = true;
const openMemos = new Set(); // original data indices with open memos

// ─── CONTROLS SETUP ─────────────────────────────────────────────────────────
const fg = document.getElementById('filterGroup');
['全て', ...INDUSTRIES].forEach(ind => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn' + (ind === '全て' ? ' active' : '');
  btn.textContent = LABEL_MAP[ind] || ind;
  btn.dataset.ind = ind;
  btn.addEventListener('click', () => {
    activeIndustry = ind;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.ind === ind));
    render();
  });
  fg.appendChild(btn);
});

document.getElementById('searchBox').addEventListener('input', e => { searchText = e.target.value.trim(); render(); });
document.getElementById('hideFinished').addEventListener('change', e => { hideFinished = e.target.checked; render(); });
document.getElementById('favOnly').addEventListener('change', e => { favOnly = e.target.checked; render(); });
document.getElementById('sortBtn').addEventListener('click', () => {
  sortAsc = !sortAsc;
  document.getElementById('sortBtn').textContent = sortAsc ? '締切 ▲ 昇順' : '締切 ▼ 降順';
  document.getElementById('thDeadline').textContent = sortAsc ? '締め切り ▲' : '締め切り ▼';
  render();
});
document.getElementById('thDeadline').addEventListener('click', () => document.getElementById('sortBtn').click());

// ─── EVENT DELEGATION ────────────────────────────────────────────────────────
const mainTable = document.getElementById('mainTable');

mainTable.addEventListener('click', e => {
  // Favorite
  const favBtn = e.target.closest('.fav-btn');
  if (favBtn) {
    const idx = +favBtn.dataset.idx;
    const s = loadState(idx);
    s.fav = !s.fav;
    saveState(idx, s);
    favBtn.textContent = s.fav ? '⭐' : '☆';
    if (favOnly && !s.fav) {
      const tr = document.querySelector(`tr.data-row[data-idx="${idx}"]`);
      const memoTr = document.getElementById(`memo-${idx}`);
      if (tr) tr.style.display = 'none';
      if (memoTr) memoTr.style.display = 'none';
    }
    updateSummary();
    return;
  }

  // Memo toggle
  const memoBtn = e.target.closest('.memo-btn');
  if (memoBtn) {
    const idx = +memoBtn.dataset.idx;
    const memoTr = document.getElementById(`memo-${idx}`);
    if (!memoTr) return;
    const isOpen = memoTr.style.display !== 'none';
    memoTr.style.display = isOpen ? 'none' : 'table-row';
    if (isOpen) openMemos.delete(idx); else openMemos.add(idx);
    if (!isOpen) memoTr.querySelector('.memo-textarea').focus();
  }
});

mainTable.addEventListener('change', e => {
  const sel = e.target.closest('.progress-select');
  if (sel) {
    const idx = +sel.dataset.idx;
    const s = loadState(idx);
    s.progress = +sel.value;
    saveState(idx, s);
    sel.className = 'progress-select ' + PROG_CLASS[s.progress];
  }
});

mainTable.addEventListener('input', e => {
  const ta = e.target.closest('.memo-textarea');
  if (ta) {
    const idx = +ta.dataset.idx;
    const s = loadState(idx);
    s.memo = ta.value;
    saveState(idx, s);
    const btn = document.querySelector(`.memo-btn[data-idx="${idx}"]`);
    if (btn) {
      btn.classList.toggle('has-memo', ta.value.length > 0);
      btn.textContent = ta.value.length > 0 ? '📝 メモあり' : '📝 メモ';
    }
  }
});

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const entries = DATA.map((r, i) => ({ r, i })).filter(({ r, i }) => {
    if (activeIndustry !== '全て' && r[0] !== activeIndustry) return false;
    if (hideFinished && r[4] === '済') return false;
    if (favOnly && !loadState(i).fav) return false;
    if (searchText && !r[1].toLowerCase().includes(searchText.toLowerCase())) return false;
    return true;
  });

  entries.sort((a, b) => {
    const diff = deadlineToNum(a.r[3]) - deadlineToNum(b.r[3]);
    return sortAsc ? diff : -diff;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  entries.forEach(({ r, i }) => {
    const [industry, company, program, deadline, dlStatus, period, note, url] = r;
    const s = loadState(i);

    // Row class
    let rowClass = 'data-row';
    if (dlStatus === '済') rowClass += ' done-row';
    else if (dlStatus === '本日') rowClass += ' today-row';
    else if (dlStatus === '明日') rowClass += ' tomorrow-row';

    // Status badge
    const badgeClass = { '済': 'sb-done', '本日': 'sb-today', '明日': 'sb-tomorrow', '未': 'sb-upcoming' }[dlStatus] || 'sb-upcoming';
    const badgeText = { '済': '締切済', '本日': '🔴 本日', '明日': '🟠 明日', '未': '未' }[dlStatus] || dlStatus;

    // Progress select
    const progOptions = PROGRESS.map((p, pi) =>
      `<option value="${pi}" ${s.progress === pi ? 'selected' : ''}>${p}</option>`
    ).join('');

    // Link
    const linkHtml = url
      ? `<a class="link-btn" href="${url}" target="_blank" rel="noopener">採用サイト →</a>`
      : '<span style="color:#ccc;font-size:.74rem">―</span>';

    // Memo button
    const hasNote = note && note !== '-';
    const hasMemo = s.memo.length > 0;
    const memoBtnText = hasMemo ? '📝 メモあり' : '📝 メモ';

    // Main row
    const tr = document.createElement('tr');
    tr.className = rowClass;
    tr.dataset.idx = i;
    tr.innerHTML = `
      <td style="text-align:center">
        <button class="fav-btn" data-idx="${i}" title="お気に入り">${s.fav ? '⭐' : '☆'}</button>
      </td>
      <td>
        <div class="company-name">${company}</div>
        <span class="industry-tag">${industry}</span>
        ${program && program !== '-' ? `<div class="program-name">${program}</div>` : ''}
        ${hasNote ? `<div class="program-name" style="color:#e67e22">${note}</div>` : ''}
      </td>
      <td>
        <span class="deadline-date">${deadline}</span>
        ${countdownHtml(deadline)}
        <br><span class="status-badge ${badgeClass}">${badgeText}</span>
      </td>
      <td>
        <select class="progress-select ${PROG_CLASS[s.progress]}" data-idx="${i}">${progOptions}</select>
      </td>
      <td style="font-size:.8rem;color:#556">${period || '―'}</td>
      <td>${linkHtml}</td>
      <td>
        <button class="memo-btn ${hasMemo ? 'has-memo' : ''}" data-idx="${i}">${memoBtnText}</button>
      </td>
    `;
    tbody.appendChild(tr);

    // Memo row
    const memoTr = document.createElement('tr');
    memoTr.className = 'memo-row';
    memoTr.id = `memo-${i}`;
    memoTr.style.display = openMemos.has(i) ? 'table-row' : 'none';
    memoTr.innerHTML = `
      <td colspan="7">
        <div class="memo-inner">
          <span class="memo-label">📝 メモ</span>
          <textarea class="memo-textarea" data-idx="${i}" placeholder="${company} へのメモ（選考状況・ES内容・感想など）">${s.memo}</textarea>
        </div>
      </td>
    `;
    tbody.appendChild(memoTr);
  });

  const empty = document.getElementById('empty');
  const table = document.getElementById('mainTable');
  empty.style.display = entries.length === 0 ? 'block' : 'none';
  table.style.display = entries.length === 0 ? 'none' : '';

  updateSummary(entries);
}

function updateSummary(entries) {
  if (!entries) {
    // recalculate
    entries = DATA.map((r, i) => ({ r, i })).filter(({ r, i }) => {
      if (activeIndustry !== '全て' && r[0] !== activeIndustry) return false;
      if (hideFinished && r[4] === '済') return false;
      if (favOnly && !loadState(i).fav) return false;
      if (searchText && !r[1].toLowerCase().includes(searchText.toLowerCase())) return false;
      return true;
    });
  }
  const upcoming = entries.filter(({ r }) => r[4] !== '済').length;
  const favCount = DATA.filter((_, i) => loadState(i).fav).length;
  document.getElementById('summary').textContent =
    `${entries.length} 件表示（うち未締切 ${upcoming} 件）　⭐ お気に入り ${favCount} 件`;
}

render();
</script>
